<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help Me Choose</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f6f6f5; --panel: #ffffff; --sunken: #f1f1ef; --ink: #18181a; --ink-2: #3c3c40; --muted: #6b6b72; --faint: #9a9aa1;
  --line: #e4e4e2; --line-2: #d4d4d1; --accent: #c2650f; --accent-ink: #ffffff; --accent-soft: #fbefe2; --accent-line: #efc79c;
  --ok: #2f7a4a; --shadow-sm: 0 1px 2px rgba(20, 20, 24, 0.06); --r: 12px;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111112; --panel: #19191b; --sunken: #141415; --ink: #eeeeef; --ink-2: #cfcfd3; --muted: #9c9ca4; --faint: #6e6e76;
  --line: #2a2a2d; --line-2: #37373b; --accent: #f2a654; --accent-ink: #1d1206; --accent-soft: #2f2216; --accent-line: #6b4721;
  --ok: #7fcf9b; --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111112; --panel: #19191b; --sunken: #141415; --ink: #eeeeef; --ink-2: #cfcfd3; --muted: #9c9ca4; --faint: #6e6e76;
  --line: #2a2a2d; --line-2: #37373b; --accent: #f2a654; --accent-ink: #1d1206; --accent-soft: #2f2216; --accent-line: #6b4721;
  --ok: #7fcf9b; --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button, input, select, a, summary, label { touch-action: manipulation; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.na { color: var(--faint); }

/* header */
.top { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--panel); }
.top::before { content: ""; position: absolute; inset: -40% auto auto -10%; width: 70%; height: 220%; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
.top .in { position: relative; max-width: 1100px; margin: 0 auto; padding: 26px max(20px, env(safe-area-inset-left)) 22px; }
h1 { font: 800 clamp(26px, 3.4vw, 36px)/1 var(--f-display); letter-spacing: -0.02em; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
h1 svg { width: 0.9em; height: 0.9em; color: var(--accent); flex: none; }
.sub { margin: 0; color: var(--muted); max-width: 64ch; }
.idxnav { display: inline-flex; gap: 3px; padding: 3px; margin-bottom: 14px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; font-weight: 600; }
.idxnav a { padding: 6px 14px; border-radius: 7px; color: var(--muted); text-decoration: none; }
.idxnav a:hover { color: var(--ink); }
.idxnav a[aria-current] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line-2); }

main { max-width: 1100px; margin: 0 auto; padding: 20px max(20px, env(safe-area-inset-left)) 64px; display: grid; gap: 16px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--sunken); border: 1px solid var(--line); border-radius: 12px; }
.tabs button { all: unset; cursor: pointer; text-align: center; padding: 10px 8px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button small { display: block; font-weight: 400; font-size: 11.5px; color: var(--faint); }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line-2); }
.tabs button:focus-visible { outline: 2px solid var(--accent); }
@media (max-width: 600px) { .tabs button small { display: none; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 16px 18px; }
.q { display: grid; gap: 16px; }
.q h2 { font: 700 12px/1 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.q h2 small { font: 400 12px/1 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--faint); margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { all: unset; cursor: pointer; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--sunken); font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip:focus-visible { outline: 2px solid var(--accent); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 28px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
select, input[type="search"], input[type="number"] { border: 1px solid var(--line-2); background: var(--sunken); border-radius: 10px; padding: 9px 12px; font-size: 16px; width: 100%; }
select:focus, input[type="search"]:focus, input[type="number"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.rng { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.rng input { accent-color: var(--accent); width: 100%; }
.rng output { font-weight: 600; min-width: 56px; text-align: right; }

.rh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.rh h2 { font: 700 18px/1.2 var(--f-display); margin: 0; }
.rh span { color: var(--muted); font-size: 13px; }
.results { display: grid; gap: 10px; }
.res { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: inherit; box-shadow: var(--shadow-sm); }
.res:hover { border-color: var(--accent); }
.res .no { font: 800 20px/1.2 var(--f-display); color: var(--accent); }
.res:first-child { border-color: var(--accent-line); background: color-mix(in srgb, var(--accent-soft) 45%, var(--panel)); }
.res b { font: 700 16px/1.25 var(--f-display); }
.res .var { color: var(--muted); font-weight: 400; font-size: 13px; }
.res .pr { font-weight: 700; white-space: nowrap; }
.res .spec { grid-column: 2 / -1; color: var(--muted); font-size: 13px; }
.more-fit { margin-top: 14px; } .more-fit > summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.res .spec b { color: var(--ink); font-weight: 600; }
.res .why { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.tag { display: inline-flex; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent-line); }
.tag.plain { background: var(--sunken); border-color: var(--line); font-weight: 500; color: var(--ink-2); }
.tag.warn { background: color-mix(in srgb, #d6453d 16%, transparent); border-color: color-mix(in srgb, #d6453d 45%, transparent); }
.tag.star { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--r); }
.more { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; padding: 4px 0; }

/* LED rows */
.dots { display: inline-flex; gap: 2px; vertical-align: middle; }
.dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18); }
.hgrp { margin-top: 14px; }
.hgrp h4 { margin: 0 0 6px; font: 700 13px/1.2 var(--f-display); }
.hgrp h4 small { font: 400 12px/1 var(--f-body); color: var(--muted); margin-left: 8px; }
.hopt { display: grid; grid-template-columns: minmax(110px, 1.2fr) minmax(130px, 1.5fr) 84px 110px 100px 70px; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); text-decoration: none; color: inherit; margin-bottom: 6px; }
.hopt:hover { border-color: var(--accent); }
.hopt.top { border-color: var(--accent-line); background: color-mix(in srgb, var(--accent-soft) 45%, var(--panel)); }
.hopt b { display: block; font-weight: 600; }
.hopt small { display: block; color: var(--muted); font-size: 12px; }
.ho-t small { color: var(--faint); }
.ho-p { text-align: right; font-weight: 600; }
.range { font-size: 12.5px; color: var(--muted); margin-left: 6px; }
.crit { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.crit.hi { color: var(--ok); }
.beam { display: inline-flex; flex-direction: column; gap: 2px; }
.beam i { display: inline-flex; gap: 2px; font-style: normal; }
.beam i b { display: block; width: 8px; height: 5px; border-radius: 2px; background: var(--line-2); }
.beam i b.on { background: var(--accent); }
.beam em { font-style: normal; font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  .hopt { grid-template-columns: minmax(0, 1fr) auto auto; }
  .hopt .ho-tint { grid-column: 1 / -1; order: 5; } .hopt .ho-t { display: none; }
}
.hhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.hhead .hn b { font: 700 17px/1.2 var(--f-display); display: block; }
.hhead .hn span { color: var(--muted); font-size: 13px; }
.btn { display: inline-flex; align-items: center; padding: 7px 13px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--sunken); text-decoration: none; color: var(--ink); font-weight: 500; cursor: pointer; font-size: 13.5px; }
.btn:hover { border-color: var(--accent); }
.prefseg { display: inline-flex; gap: 3px; padding: 3px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; }
.prefseg button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); }
.prefseg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line-2); }
.tpick { display: grid; gap: 8px; margin: 14px 0 4px; }
.tp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
.tp-card { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--accent-line); border-radius: 10px; background: color-mix(in srgb, var(--accent-soft) 45%, var(--panel)); text-decoration: none; color: inherit; }
.tp-card:hover { border-color: var(--accent); }
.tp-star { font: 700 11px/1.2 var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-right: 8px; }
.tp-card b { font: 700 17px/1.2 var(--f-display); }
.tp-card small { color: var(--muted); margin-left: 8px; }
.tp-why { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.hnote { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
.build .res { grid-template-columns: 30px minmax(0, 1fr); }
.build .res .spec b { font: inherit; font-weight: 600; color: var(--ink-2); }
.build .tl { grid-column: 2; font-size: 13px; color: var(--ink-2); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top"><div class="in">
  <nav class="idxnav" aria-label="Pages"><a href="../flashlights/">Flashlights</a><a href="../leds/">LEDs</a><a href="./" aria-current="page">Help me choose</a></nav>
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Help me choose</h1>
  <p class="sub">Don't know what light to buy? Already have one and need to pick its LED? Building your own? Answer a few questions and get a short list, with the reason for each pick.</p>
</div></header>

<main>
  <div class="tabs" role="tablist" aria-label="What do you need?">
    <button type="button" role="tab" data-tab="light" aria-selected="true">Find a light<small>I don't know what to buy</small></button>
    <button type="button" role="tab" data-tab="led" aria-selected="false">LED for a light<small>I have one in mind</small></button>
    <button type="button" role="tab" data-tab="build" aria-selected="false">Build a light<small>I need an emitter</small></button>
  </div>
  <section id="p-light" role="tabpanel"></section>
  <section id="p-led" role="tabpanel" hidden></section>
  <section id="p-build" role="tabpanel" hidden></section>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = n => Math.round(n).toLocaleString("en-US");
  const kcd = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : Math.round(n / 1000) + "k";
  const REF_MM = 37.5;
  const BEAM_NAMES = ["", "Flood", "Floody", "Balanced", "Throwy", "Pencil"];
  const BEAM_DESC = ["", "wall of light, no real hotspot", "wide, even light", "hotspot with usable spill", "punchy hotspot", "razor-thin pencil beam"];
  const slug = (...p) => p.filter(Boolean).join(" ").toLowerCase().replace(/&/g, " and ").replace(/\+/g, " plus ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  const usd = n => "$" + (n % 1 ? n.toFixed(2) : n);
  const clamp01 = v => Math.min(1, Math.max(0, v));
  function cct(k) { // colour temperature -> sRGB (Tanner Helland approximation)
    const t = k / 100; let r, g, b;
    r = t <= 66 ? 255 : 329.7 * Math.pow(t - 60, -0.1332);
    g = t <= 66 ? 99.47 * Math.log(t) - 161.1 : 288.1 * Math.pow(t - 60, -0.0755);
    b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.5 * Math.log(t - 10) - 305.0);
    const c = v => Math.max(0, Math.min(255, Math.round(v)));
    return `rgb(${c(r)},${c(g)},${c(b)})`;
  }
  const dotsOf = ks => `<span class="dots">${ks.map(k => `<span class="dot" style="background:${cct(k)}"></span>`).join("")}</span>`;
  const cctRange = ks => !ks.length ? "" : ks.length > 1 ? `${ks[0]}–${ks[ks.length - 1]}K` : `${ks[0]}K`;
  const strip = h => String(h || "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();

  let lights = [], E = [], byId = new Map(), idOf = () => null, uses = [];
  const params = new URLSearchParams(location.search);
  let pref = "balanced";
  try { pref = localStorage.getItem("led-pref") || "balanced"; } catch (e) {}
  const PREFS = [["output", "Max output", "Most lumens; CRI doesn't matter"], ["balanced", "Balanced", "The usual expert pick for this kind of light"], ["colour", "Best colour", "Highest CRI; lumens matter less"]];
  if (!PREFS.some(p => p[0] === pref)) pref = "balanced";
  const setPref = v => { pref = v; try { localStorage.setItem("led-pref", v); } catch (e) {} };
  const prefSeg = () => `<div class="prefseg" role="group" aria-label="What matters most">${PREFS.map(([v, l, h]) => `<button type="button" data-pref="${v}" aria-pressed="${pref === v}" title="${h}">${l}</button>`).join("")}</div>`;
  const chips = (key, opts, sel, multi) => `<div class="chips" data-q="${key}">${opts.map(([v, l]) => `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${multi ? sel.has(v) : sel === v}">${esc(l)}</button>`).join("")}</div>`;

  /* ================= 1. Find a light ================= */
  const USE = [["", "Anything"], ["edc", "Everyday carry"], ["key", "Keychain / tiny"], ["throw", "Long throw"], ["head", "Headlamp"], ["flood", "Lots of light (flood)"]];
  const USE_STYLES = { edc: ["EDC"], key: ["Keychain"], throw: ["Thrower"], head: ["Headlamp"], flood: ["Flood", "Big & bright"] };
  const USE_DEFAULT = { throw: ["throw"], key: ["small", "bright"], flood: ["bright"] }; // what to lean on when no priority is ticked
  // The hand-picked lists from EDITOR in flashlights/index.html (keep in step). A pick that fits the question gets a bonus.
  const EDITOR = {
    "": ["emisar-d4kc-standard-aluminium"],
    "Everyday carry": ["emisar-d4kc-standard-aluminium", "wurkkos-ts26", "convoy-s21e"],
    "Long throw": ["noctigon-dm11-standard-aluminium", "noctigon-k1-standard-aluminium"],
    "Headlamp": ["skilhunt-h300-h300r", "sofirn-hs21"],
    "Keychain": ["emisar-kc1-standard-aluminium", "rovyvon-aurora-a1-g4"],
    "High CRI": ["emisar-d4v2-standard-aluminium", "convoy-s21e"],
    "Brightest": ["sofirn-sp36-pro"],
    "Under $30": ["convoy-s21e", "convoy-h2"],
    "Anduril": ["emisar-d4kc-standard-aluminium", "emisar-d3aa-standard-aluminium"],
  };
  const EDITOR_USE = { edc: "Everyday carry", key: "Keychain", throw: "Long throw", head: "Headlamp", flood: "Brightest" };
  function editorSlugs() {
    const g = [];
    if (EDITOR_USE[S1.use]) g.push(EDITOR_USE[S1.use]);
    if (S1.budget && +S1.budget <= 30) g.push("Under $30");
    if (S1.prio.has("colour")) g.push("High CRI");
    if (S1.must.has("and")) g.push("Anduril");
    return new Set((g.length ? g : [""]).flatMap(k => EDITOR[k] || []));
  }
  const BUDGET = [["", "Any"], ["30", "Under $30"], ["60", "Under $60"], ["120", "Under $120"]];
  const PRIO = [["colour", "Colour quality"], ["bright", "Brightness"], ["throw", "Reach"], ["small", "Small & light"]];
  const MUST = [["usb", "USB charging"], ["wp", "Submersible"], ["and", "Anduril firmware"]];
  const MUSTF = { usb: l => !!l.charging?.port, wp: l => !!l.ip?.submersible, and: l => !!l.anduril };
  const S1 = { use: "", budget: "", prio: new Set(), must: new Set(), oos: true };

  function baseScore(l) { // how good a representative of its model this listing is, independent of what the user asked for
    let s = 0;
    const es = l.led_families.map(f => byId.get(idOf(f))).filter(Boolean);
    if (es.some(e => e.rep?.t === "staple" || e.best_for.some(b => b.tier === 1))) s += 1.5;
    s += ["price", "lumens", "throw_m", "weight_g"].filter(k => l[k] != null).length / 4;
    s += Math.min(l.led_families.length, 4) / 8;
    if (/mule/i.test(l.variant || "")) s -= 1.5;
    if (/\b(limited|special edition|edition)\b/i.test(`${l.model} ${l.variant || ""}`)) s -= 1;
    if (!l.ccts.length && !l.tones_nocct.length) s -= 1;
    return s;
  }
  function findLights() {
    const st = USE_STYLES[S1.use], budget = +S1.budget || null;
    const pool = lights.filter(l => {
      if (st && !(l.styles || []).some(x => st.includes(x))) return false;
      if (budget && !(l.price != null && l.price <= budget)) return false;
      if (S1.oos && l.stock?.status === "out") return false;
      for (const m of S1.must) if (!MUSTF[m](l)) return false;
      return true;
    });
    const prios = S1.prio.size ? [...S1.prio] : (USE_DEFAULT[S1.use] || []);
    // Absolute scores that stop rewarding past a sensible point, so an 80,000 lm searchlight doesn't beat a 12,000 lm
    // light just for being bigger, and an 8 g light doesn't beat a 12 g one that's ten times brighter.
    const lg = (v, lo, hi) => clamp01(Math.log(v / lo) / Math.log(hi / lo));
    const PS = {
      colour: l => l.cri_max >= 90 ? 1 : l.cri_max >= 80 ? 0.5 : l.cri_max ? 0.1 : 0.2,
      bright: l => l.lumens == null ? 0.2 : lg(l.lumens, 300, 10000),
      throw: l => l.throw_m == null ? 0.2 : lg(l.throw_m, 50, 1000),
      small: l => l.weight_g == null ? 0.2 : 1 - lg(l.weight_g, 10, 250),
    };
    const ed = editorSlugs();
    pool.forEach(l => {
      l._ed = ed.has(slug(l.brand, l.model, l.variant));
      const cost = l.price == null ? 0.5 : lg(l.price, 15, 300); // cheaper wins ties, and expensive needs to earn it
      const dim = l.lumens != null && l.lumens < 300 && S1.use !== "key"; // under 300 lm is a specialist light, not a general pick
      l._s = baseScore(l) + prios.reduce((a, p) => a + 4 * PS[p](l), 0) - 0.6 * cost - (dim ? 1 : 0) + (l._ed ? 0.8 : 0); // a nudge between close calls, never enough to override what was asked for
    });
    const left = pool.slice().sort((a, b) => b._s - a._s || (a.price ?? 1e9) - (b.price ?? 1e9)), seen = {}, out = [];
    while (left.length) { // each earlier pick from the same brand costs 0.4, so one store can't fill the list
      let bi = 0, bv = -Infinity;
      for (let i = 0; i < left.length; i++) { const v = left[i]._s - 0.4 * (seen[left[i].brand] || 0); if (v > bv) { bv = v; bi = i; } if (left[i]._s < bv) break; }

      ${all.length > 6 ? `<p><button type="button" class="more" data-act="more3">${showAll3 ? "Show fewer" : `Show ${Math.min(all.length, 40) - 6} more`}</button></p>` : ""}
      ${otherHtml}
      <p class="hnote">Voltage has to match your build: 3V LEDs suit a single emitter or parallel wiring; 6V and 12V versions are wired in series and need a driver that can supply that. Throw is a ballpark from typical 35–40 mm figures scaled by reflector area (±50%).</p>`
      : `<div class="empty"><b>No LED fits that combination.</b><br>Try another footprint or voltage.</div>`;
  }

  /* ================= wiring ================= */
  function showTab(t) {
    if (!["light", "led", "build"].includes(t)) t = "light";
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    ["light", "led", "build"].forEach(k => $("#p-" + k).hidden = k !== t);
    if (t === "light") renderLight(); else if (t === "led") { if (!$("#p-led").firstChild || !host) renderLed(); } else renderBuild();
    const p = new URLSearchParams(location.search); p.set("tab", t); if (t !== "led") p.delete("for");
    else if (host) p.set("for", host.l._name);
    history.replaceState(null, "", "?" + p);
  }
  document.addEventListener("click", ev => {
    const t = ev.target;
    const tab = t.closest("[data-tab]"); if (tab) { showTab(tab.dataset.tab); return; }
    const pf = t.closest("[data-pref]"); if (pf) { setPref(pf.dataset.pref); if (!$("#p-led").hidden) renderLed(); if (!$("#p-build").hidden) renderBuild(); return; }
    const hp = t.closest("[data-hostpick]"); if (hp) { setHost(hp.dataset.hostpick); return; }
    const act = t.closest("[data-act]")?.dataset.act;
    if (act === "hostclear") { host = null; const p = new URLSearchParams(location.search); p.delete("for"); history.replaceState(null, "", "?" + p); renderLed(); return; }
    if (act === "more1") { showAll1 = !showAll1; renderLight(); return; }
    if (act === "more3") { showAll3 = !showAll3; renderBuild(); return; }
    const c = t.closest(".chip[data-v]"); if (!c) return;
    const k = c.parentElement.dataset.q, v = c.dataset.v;
    if (k === "use" || k === "budget") S1[k] = v;
    else if (k === "must") S1.must.has(v) ? S1.must.delete(v) : S1.must.add(v);
    else if (k === "prio") { if (S1.prio.has(v)) S1.prio.delete(v); else { if (S1.prio.size >= 2) S1.prio.delete([...S1.prio][0]); S1.prio.add(v); } }
    showAll1 = false; renderLight(); // rebuilds the chips, so put focus back on the one that was pressed
    document.querySelector(`#p-light [data-q="${k}"] [data-v="${CSS.escape(v)}"]`)?.focus();
  });
  document.addEventListener("input", ev => {
    const t = ev.target;
    if (t.id === "b-amps") { S3.amps = t.value; renderBuild(); }
    else if (t.id === "b-mm") { S3.mm = +t.value; $("#b-mmo").textContent = `${S3.mm} mm`; renderBuild(); }
    else if (t.id === "hostq") { const v = t.value.trim().toLowerCase(), l = lights.find(x => x._name === v); if (l) setHost(l._name); }
  });
  document.addEventListener("change", ev => {
    const t = ev.target;
    if (t.id === "oos") { S1.oos = t.checked; renderLight(); return; }
    const m = { "b-goal": "goal", "b-fp": "fp", "b-volt": "volt", "b-n": "n" }[t.id];
    if (m) { S3[m] = m === "n" ? +t.value : t.value; showAll3 = false; renderBuild(); }
    else if (t.id === "hostq") setHost(t.value);
  });

  fetch("../flashlights/lights.clean.json").then(r => r.json()).then(async rows => {
    const doc = await fetch("../leds/emitters.json").then(r => r.json());
    lights = rows.map(r => ({ ...r, styles: r.styles || [], _name: `${r.brand} ${r.model} ${r.variant || ""}`.trim().toLowerCase() }));
    E = doc.emitters.map(e => ({ ...e, _tier: Object.fromEntries(e.best_for.map(b => [b.goal, b.tier])) }));
    byId = new Map(E.map(e => [e.id, e])); uses = doc.uses || [];
    const norm = s => s.replace(/\s*\(.*?\)/g, "").trim().toLowerCase(), cache = new Map();
    idOf = t => { if (!cache.has(t)) {
      const n = norm(t); // exact name first, then alias, then paren-stripped fuzzy, so "XP-E2" doesn't collide with "XP-E2 (colour)"
      const e = E.find(e => e.name === t) || E.find(e => e.alts.includes(t)) || E.find(e => norm(e.name) === n || e.alts.some(a => norm(a) === n) || norm(`${e.maker} ${e.name}`) === n);
      cache.set(t, e ? e.id : null);
    } return cache.get(t); };
    const wantFor = params.get("for");
    showTab(wantFor ? "led" : params.get("tab"));
    if (wantFor) setHost(wantFor);
  }).catch(err => {
    console.error(err);
    $("#p-light").innerHTML = `<div class="empty"><b>The data didn't load</b><br>Open this page through a local web server (run <code>python3 -m http.server</code> in the public folder), then reload.</div>`;
  });
})();
</script>
</body>
</html>
